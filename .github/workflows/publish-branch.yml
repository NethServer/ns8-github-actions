name: "Publish images"

on:
  workflow_call:
    inputs:
      runner-version:
        description: 'The version of the runner'
        required: false
        default: 'ubuntu-latest'
        type: string
      extra-cache-paths:
        description: 'Additional file paths to cache between runs (multiline, one path per line)'
        required: false
        default: ''
        type: string
      extra-cache-key-prefix:
        description: 'Prefix string for the extra cache key'
        required: false
        default: ''
        type: string
      extra-cache-key-file:
        description: 'File whose content is hashed to generate the extra cache key. A version file is a good candidate.'
        required: false
        default: ''
        type: string
      imagetag:
        description: "The image tag to use when publishing. Defaults to the branch or tag name that triggered the workflow."
        required: false
        type: string
        default: ${{ github.ref_name }}
    secrets:
      netrcb64:
        description: "Netrc Base64-encoded file content for authenticated downloads. Overrides netrc secret."
        required: false

permissions:
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish_images:
    name: 'Publish module images'
    runs-on: ${{ inputs.runner-version }}
    env:
      REPOBASE: ghcr.io/${{ github.repository_owner }}
      IMAGETAG: ${{ inputs.imagetag }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/cache@v6
        with:
          path: ui/node_modules
          key: "yarn-${{ hashFiles('ui/yarn.lock') }}"
      - id: extra-cache-key
        if: inputs.extra-cache-paths != ''
        env:
          KEY_FILE: ${{ inputs.extra-cache-key-file }}
          KEY_PREFIX: ${{ inputs.extra-cache-key-prefix }}
        run: |
          if [ -z "${KEY_FILE// }" ]; then
            hash='no-key-file'
          elif [ ! -f "$KEY_FILE" ]; then
            echo "::error::inputs.extra-cache-key-file was provided, but the file does not exist or is not a regular file: $KEY_FILE"
            exit 1
          else
            hash=$(sha256sum "$KEY_FILE" | awk '{print $1}')
          fi
          if [ -z "$KEY_PREFIX" ]; then
            echo "key=${hash}" >> "$GITHUB_OUTPUT"
          else
            echo "key=${KEY_PREFIX}-${hash}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v6
        if: inputs.extra-cache-paths != ''
        with:
          path: ${{ inputs.extra-cache-paths }}
          key: ${{ steps.extra-cache-key.outputs.key }}
      - id: build
        run: |
          # Write .netrc file with the secret contents:
          ( umask 077 ; base64 -d <<<"${{ secrets.netrcb64 }}" >~/.netrc || : ; )
          # Build the module images
          REPOBASE=${REPOBASE,,}
          export REPOBASE
          # Sanitize tag syntax: slashes are not allowed
          # Abort if IMAGETAG is unset or empty
          : "${IMAGETAG:?}"
          # Replace '/' with '-'
          IMAGETAG=$(printf '%s' "${IMAGETAG}" | tr '/' '-')
          # Make sanitized value available to build-images.sh and subsequent steps
          export IMAGETAG
          echo "IMAGETAG=${IMAGETAG}" >> "$GITHUB_ENV"
          bash build-images.sh
      - id: publish
        run: |
          # Publish the branch
          trap 'buildah logout ghcr.io' EXIT
          buildah login -u ${{ github.actor }} --password-stdin ghcr.io <<<"${{ secrets.GITHUB_TOKEN }}"
          images=(${{ steps.build.outputs.images }})
          urls=""
          for image in "${images[@]}" ; do
            buildah push $image docker://${image}:${IMAGETAG}
            if [[ "${IMAGETAG}" == "main" || "${IMAGETAG}" == "master" ]]; then
                buildah push $image docker://${image}:latest
            fi
            urls="${image}:${IMAGETAG} "$'\n'"${urls}"
          done
          echo "::notice title=Image URLs::${urls}"
