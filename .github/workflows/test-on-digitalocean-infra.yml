name: "Setup NS8 clusters on DigitalOcean and test module"

on:
  workflow_call:
    inputs:
      script:
        required: false
        description: "Name of the script to execute. If empty, the default script from ns8-github-actions is used."
        type: string
        default: ""
      path:
        required: false
        type: string
        description: "Subdirectory of the module repository to use as working directory when running the test script"
      args:
        required: false
        type: string
        description: "Path where is located the script"
      repo_ref:
        required: false
        type: string
        default: ${{ github.sha }}
        description: "Additional arguments to pass to the script"
      debug_shell:
        required: false
        type: boolean
        default: false
        description: "Obtain a debug shell via https://tmate.io/"
      coremodules:
        required: false
        type: string
        description: "List of space-separated module URL to pull and use during the NS8 installation process"
      corebranch:
        required: false
        type: string
        default: ns8-stable
        description: "Branch/tag of the `ns8-core` repository from where to get the installation script"
      setup_cluster:
        required: false
        type: boolean
        default: true
        description: "If true the workflow will install and setup a NS8 cluster"
      leader_nodes:
        required: false
        type: string
        default: "dn1 rl1"
        description: "List of space-separated leader nodes to create"
      do_project:
        required: false
        type: string
        default: "NS8-CI"
        description: "DigitalOcean project where to create the droplets"
      do_domain:
        required: false
        type: string
        default: "ci.nethserver.net"
        description: "DigitalOcean domain where to create the DNS records"
      run_ui_tests:
        required: false
        type: boolean
        default: false
        description: "If true, run UI tests"
      ui_test_node:
        required: false
        type: string
        default: "rl1"
        description: "Run UI tests only on this node (avoids duplicate runs across distros since the Playwright container is the same)"
    secrets:
      do_token:
        required: true
        description: "DigitalOcean token to use for create the infrastructure"
env:
  TF_VAR_project: ${{ inputs.do_project }}
  TF_VAR_domain: ${{ inputs.do_domain }}

jobs:
  info:
    name: "Find NS8 cluster informations"
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.nodes.outputs.list }}
      short_sha: ${{ steps.short_sha.outputs.value }}
    steps:
      - name: "Create the list of leader nodes"
        id: nodes
        run: |
          nodes=$(jq -ncR '[inputs]' <<< "$(echo ${{ inputs.leader_nodes }} | tr ' ' '\n')")
          echo "list=${nodes}" >> $GITHUB_OUTPUT
      - name: "Get the short sha of the current commit"
        id: short_sha
        run: echo "value=$( echo ${{ inputs.repo_ref }} | cut -c1-8 )" >> $GITHUB_OUTPUT
  test-module:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref_name }}-${{ matrix.node }}
      cancel-in-progress: true
    name: "Test on DigitalOcean"
    runs-on: ubuntu-latest
    needs: info
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.info.outputs.nodes) }}
    steps:
      - id: create_status
        name: "Create commit status"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status_page=$(
            gh run view ${{ github.run_id }} \
            --repo ${{ github.repository }} \
            --json jobs \
            --jq '.jobs[] | select(.name | contains("/ Test on DigitalOcean (${{ matrix.node }})")).url'
          )
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha || github.sha}} \
            -f "state=pending" \
            -f "target_url=$status_page" \
            -f "description=Test on DigitalOcean (${{ matrix.node }})" \
            -f "context=continuous-integration/robotframework/${{ matrix.node }})"
      - name: "Checkout the module repository"
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.repo_ref }}
          path: module
      - name: "Get ns8-github-actions ref"
        id: ns8_ga_ref
        run: echo "ref=$(echo '${{ github.workflow_ref }}' | cut -d'@' -f2)" >> $GITHUB_OUTPUT
      - name: "Checkout ns8-github-actions"
        uses: actions/checkout@v6
        with:
          repository: NethServer/ns8-github-actions
          ref: ${{ steps.ns8_ga_ref.outputs.ref }}
          path: ns8-github-actions
      - name: "Checkout the infrastructure repository"
        uses: actions/checkout@v6
        with:
          repository: NethServer/ns8-terraform-infra
          path: infra
      - name: "OpenTofu - Setup Tofu"
        uses: opentofu/setup-opentofu@v2.0.0
        with:
          tofu_wrapper: false
      - name: "OpenTofu - Tofu Apply"
        env:
          TF_VAR_do_token: ${{ secrets.do_token }}
        run: |
          tofu init
          tofu workspace new ${{ matrix.node }}-${{ needs.info.outputs.short_sha }}
          tofu apply -var 'leader_node={"${{ matrix.node }}":"ams3"}' -auto-approve
        working-directory: ${{ github.workspace }}/infra
      - name: "OpenTofu - Tofu Output Deploy Key"
        run: |
          tofu output -raw deploy-key > ${{ github.workspace }}/key
          chmod 700 ${{ github.workspace }}/key
        working-directory: ${{ github.workspace }}/infra
      - name: "Wait for SSH server do be READY"
        run: |
          for (( c=1; c<=20; c++ )); do
          set +e
            ssh -o StrictHostKeyChecking=no -o GlobalKnownHostsFile=/dev/null -i ${{ github.workspace }}/key \
              root@${{ matrix.node }}.leader.${{ matrix.node }}-${{ needs.info.outputs.short_sha }}.${{ env.TF_VAR_domain }} true
            if [ "$?" = "0" ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: "Wait for boot to complete"
        run: |
          ssh -o StrictHostKeyChecking=no -o GlobalKnownHostsFile=/dev/null -i ${{ github.workspace }}/key \
            root@${{ matrix.node }}.leader.${{ matrix.node }}-${{ needs.info.outputs.short_sha }}.${{ env.TF_VAR_domain }} \
            'systemctl is-system-running --wait || : '
      - name: "Install NS8 system"
        if: inputs.setup_cluster
        run: |
          ssh -o StrictHostKeyChecking=no -o GlobalKnownHostsFile=/dev/null -i ${{ github.workspace }}/key \
          root@${{ matrix.node }}.leader.${{ matrix.node }}-${{ needs.info.outputs.short_sha }}.${{ env.TF_VAR_domain }} << EOF
            set -e -x
            [ -f /etc/yum.conf ] && echo "exclude=kernel* kmod* microcode_ctl grub2*" >> /etc/yum.conf # disable Rocky Linux kernel upgrade
            curl -O https://raw.githubusercontent.com/NethServer/ns8-core/${{ inputs.corebranch }}/core/install.sh
            bash install.sh ${{ inputs.coremodules }}
          EOF
      - name: "Create NS8 Cluster"
        if: inputs.setup_cluster
        run: |
          ssh -o StrictHostKeyChecking=no -o GlobalKnownHostsFile=/dev/null -i ${{ github.workspace }}/key \
          root@${{ matrix.node }}.leader.${{ matrix.node }}-${{ needs.info.outputs.short_sha }}.${{ env.TF_VAR_domain }} << EOF
            set -e -x
            create-cluster ${{ matrix.node }}.leader.${{ matrix.node }}-${{ needs.info.outputs.short_sha }}.${{ env.TF_VAR_domain }}:55820 10.5.4.0/24 Nethesis,1234
          EOF
      - name: "Run tests"
        id: run_tests
        run: |
          if [ -n "${{ inputs.script }}" ]; then
            script_path="${{ github.workspace }}/module/${{ inputs.path }}/${{ inputs.script }}"
          else
            script_path="${{ github.workspace }}/ns8-github-actions/scripts/test-module.sh"
          fi
          bash "$script_path" ${{ matrix.node }}.leader.${{ matrix.node }}-${{ needs.info.outputs.short_sha }}.${{ env.TF_VAR_domain }} ${{ inputs.args }}
        working-directory: ${{ github.workspace }}/module/${{ inputs.path }}
        env:
          SSH_KEYFILE: ${{ github.workspace }}/key
          COREMODULES: ${{ inputs.coremodules }}
          RUN_UI_TESTS: ${{ inputs.run_ui_tests && matrix.node == inputs.ui_test_node }}
      - name: "Save tests results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tests-logs-${{ matrix.node }}
          path: |
            ${{ github.workspace }}/module/${{ inputs.path }}/tests/outputs/
      - id: update-status
        name: "Update commit status"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status_page=$(
            gh run view ${{ github.run_id }} \
            --repo ${{ github.repository }} \
            --json jobs \
            --jq '.jobs[] | select(.name | contains("/ Test on DigitalOcean (${{ matrix.node }})")).url'
          )

          if [ "${{ steps.run_tests.outcome }}" == "success" ]; then
            state="success"
          elif [ "${{ steps.run_tests.outcome }}" == "failure" ]; then
            state="failure"
          elif [ "${{ job.status }}" == "failure" ]; then
            state="error"
          else
            state="pending"
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha || github.sha}} \
            -f "state=$state" \
            -f "target_url=$status_page" \
            -f "description=Test on DigitalOcean (${{ matrix.node }})" \
            -f "context=continuous-integration/robotframework/${{ matrix.node }}"
      - name: "Setup CML"
        if: inputs.run_ui_tests == true && matrix.node == inputs.ui_test_node
        run: npm install --location=global @dvcorg/cml
      - name: "Find PR number"
        if: inputs.run_ui_tests == true && matrix.node == inputs.ui_test_node
        id: find_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Try to get PR from event context first (for PR triggers)
          pr_number="${{ github.event.pull_request.number }}"

          if [ -z "$pr_number" ]; then
            # For workflow_dispatch, find the PR by branch or commit
            branch="${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}"
            pr_number=$(gh pr list \
              --repo "${{ github.repository }}" \
              --head "$branch" \
              --state open \
              --json number \
              --jq '.[0].number' 2>/dev/null || echo "")
          fi

          echo "number=$pr_number" >> $GITHUB_OUTPUT
      - name: "Post screenshots to PR"
        if: inputs.run_ui_tests == true && matrix.node == inputs.ui_test_node && steps.find_pr.outputs.number != ''
        env:
          REPO_TOKEN: ${{ github.token }}
          MODULE_PATH: ${{ inputs.path }}
          PR_NUMBER: ${{ steps.find_pr.outputs.number }}
        run: |
          output_dir="${{ github.workspace }}/module${MODULE_PATH:+/$MODULE_PATH}/tests/outputs"
          echo "### UI Test Screenshots \`${{ matrix.node }}\`" >> comment.md
          mapfile -d '' screenshots < <(find "$output_dir" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.webp' \) -print0 2>/dev/null | sort -z)
          if [ ${#screenshots[@]} -eq 0 ]; then
            echo "No screenshots found in test outputs." >> comment.md
          else
            for f in "${screenshots[@]}"; do
              name=$(basename "${f%.*}")
              name="${name//_/ }"
              echo "**${name}**" >> comment.md
              echo "" >> comment.md
              echo "![$(basename "$f")]($f)" >> comment.md
              echo "" >> comment.md
            done
          fi
          cml comment create --target=pr/$PR_NUMBER --repo="https://github.com/${{ github.repository }}" comment.md
      - name: "Debugging with tmate"
        if: ${{ inputs.debug_shell == true && ! cancelled() && always() }}
        uses: mxschmitt/action-tmate@v3
      - name: "OpenTofu - Tofu Destroy"
        if: ${{ always() }}
        env:
          TF_VAR_do_token: ${{ secrets.do_token }}
        run: tofu apply -destroy -auto-approve
        working-directory: ${{ github.workspace }}/infra
