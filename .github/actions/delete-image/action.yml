name: "Delete an image from ghcr.io"
inputs:
  images:
    required: true
  delete_image_token:
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REF: ${{ github.event.ref }}
      run: |
        # Deleting images for ${{ github.event.ref }}
        # Image tags have "/" replaced by "-", as publish-branch does
        ref=${REF//\//-}
        gh auth login --with-token <<<"${{ inputs.delete_image_token }}"
        for image in ${{ inputs.images }} ; do
          versions_path="${{ github.event.organization.url || github.event.repository.owner.url }}/packages/container/${image}/versions"
          # Select versions tagged only with the branch name, or with the
          # branch name followed by a commit hash (e.g. "branch-1a2b3c4")
          version_ids=$(gh api --paginate "${versions_path}" | jq -r --arg ref "${ref}" '
            .[]
            | select(.metadata.container.tags | length > 0)
            | select(all(.metadata.container.tags[];
                . == $ref
                or (startswith($ref + "-") and (.[($ref | length) + 1:] | test("^[0-9a-f]{7,40}$")))))
            | .id')
          for version_id in ${version_ids}; do
            gh api --input /dev/null -X DELETE ${versions_path}/${version_id}
            echo "::notice::DELETE ${versions_path}/${version_id}"
          done
        done
